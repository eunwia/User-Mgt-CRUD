<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="ie-edge">
		<meta name="viewport" content="width=device-width,initial-scale=1.0">
		<link rel="stylesheet" href="{{ url_for('static',filename='css/w3.css') }}">
		<style>
            .success { color: green; }
            .error { color: red; }
            .info { color: blue; }
        </style>
		<title>Users Management</title>
	</head>
	<body >
		<div class='w3-bar w3-indigo w3-padding'>
			<h3 class='w3-bar-item'>Users Management</h3>
		</div>
		<div class='w3-padding'>
			{% with messages = get_flashed_messages(with_categories=true) %}
				{% if messages %}
					
						<ul class="flashes">
							{% for category, message in messages %}
								<li class="{{ category }}">{{ message }}</li>
							{% endfor %}
						</ul>
					
				{% endif %}
			{% endwith %}
			{% block content %}
			{% endblock %}
		</div>
		
		<center>
			&copy; copyright, trixette rain montallana, 2025
		</center>
		<script>
			function logout(){
				location.href="/logout";
				location.reload()
			}
			
			function modalcontrol(modal,control){
				document.getElementById(modal).style.display=control;
			}
			function deleteuser(id){
				var ok=confirm("Delete this Student?");
				if(ok){
					location.href="/deleteuser?id="+id;
				}
			}
			function edituser(id,username,password){
				modalcontrol('mymodal','block');
				console.log(id)
				document.getElementById('username').value=username;
				document.getElementById('password').value=password;
				document.getElementById('type').value='edit';
				document.getElementById('id').value=id;
			}
			
		</script>
	</body>
</html>
