{% extends 'base.html'%}
{% block content %}
	<div class='w3-mobile w3-card-4 w3-padding w3-round-xlarge w3-animate-top' style='width:40%;margin:auto'>
		<form action="/loginvalidate" method='post'>
			<p>
				<label><b>USERNAME</b><label>
				<input type='text' name='username' placeholder='Enter Username' class="w3-input">
			</p>
			<p>
				<label><b>PASSWORD</b><label>
				<input type='password' name='password' placeholder='******' class="w3-input">
			</p>
			<p>
				<input type='submit' value='LOGIN' class='w3-button w3-blue w3-right'>
				<br>
			</p>
			
		</form>
		
	</div>
{% endblock %}
